<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Me</title>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    margin:0;
}

header{
    background:#1976d2;
    color:white;
    text-align:center;
    padding:25px;
}

nav{
    background:#1565c0;
    padding:12px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
}

.container{
    width:90%;
    max-width:700px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input,
textarea,
select{

    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;

}

textarea{
    min-height:150px;
    resize:vertical;
}

button{

    margin-top:20px;
    background:#1976d2;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;

}

button:hover{
    background:#0d47a1;
}

footer{
    margin-top:40px;
    text-align:center;
    background:#1565c0;
    color:white;
    padding:20px;
}

</style>

<body>

<header>

<h1>Contact Me</h1>

<p>I'd love to hear from you.</p>

</header>

<nav>

<div class="container">

<form action="https://formsubmit.co/subhodashyd@gmail.com" method="POST">

<input type="hidden" name="_captcha" value="false">

<input type="hidden" name="_subject" value="New Contact from Mental Health Website">

<label>Your Name</label>

<input
type="text"
name="Name"
required>

<label>Email Address</label>

<input
type="email"
name="Email"
required>

<label>Reason for Contact</label>

<select name="Reason">

<option>Need Mental Health Support</option>

<option>Corporate Stress Guidance</option>

<option>Speaking Invitation</option>

<option>Course Enquiry</option>

<option>Collaboration</option>

<option>General Question</option>

</select>

<label>Your Message</label>

<textarea
name="Message"
required></textarea>

<button type="submit">

Send Message

</button>

</form>

</div>
<section style="padding:60px;text-align:center;">

or collaborate, I'd be happy to hear from you.

</p>
